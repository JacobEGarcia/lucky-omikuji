function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);

return{g,line,item,num};}

const KN=['','一','二','三','四','五','六','七','八','九'];
function kanNum(n){
if(n===100)return '百';
const t=Math.floor(n/10),o=n%10;
if(t===0)return KN[o];
if(o===0)return (t>1?KN[t]:'')+'十';
return (t>1?KN[t]:'')+'十'+KN[o];}

function setPhase(p){st.phase=p;st.phaseT=st.t;
hintEl.textContent=
 p==='idle'?(st.daily&&st.daily.tied?'today\u2019s luck is settled - practice draws are open':st.daily?'today\u2019s draw is waiting above - or practice again':'shake the box'):
 p==='rattle'?'...':
 p==='stick'?'pull the stick':
 p==='slip'?(st.draw&&!st.draw.g.good?'bad luck stays here. tap to tie it to the rope':(st.practice?'a practice slip - tomorrow counts again':'keep this one close. tap to carry it')):
 p==='tied'?'left behind. walk lighter. tap for the box':
 p==='keep'?'carried with you. tap for the box':'';}

// streak bookkeeping when a true daily draw happens
function commitDaily(d){
const yesterday=(()=>{const t=new Date();t.setDate(t.getDate()-1);return t.getFullYear()*10000+(t.getMonth()+1)*100+t.getDate();})();
if(P.streakLast===yesterday)P.streak++;else P.streak=1;
P.streakLast=TODAY;
P.last=TODAY;P.gk=d.g.k;P.line=d.line;P.item=d.item;P.num=d.num;P.tied=false;save();
st.daily={g:d.g,line:d.line,item:d.item,num:d.num,tied:false};
streakEl.textContent='STREAK '+P.streak;}
streakEl.textContent='STREAK '+P.streak;

// ---------- audio (soft wood clacks + bell) ----------
let AC=null;
function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}return AC;}
function clack(v){const a=ac();if(!a)return;
const t0=a.currentTime,b=a.createBuffer(1,a.sampleRate*0.03,a.sampleRate),d=b.getChannelData(0);
for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,2);
const src=a.createBufferSource();src.buffer=b;
const f=a.createBiquadFilter();f.type='bandpass';f.frequency.value=1800+Math.random()*800;f.Q.value=2.5;
const g=a.createGain();g.gain.setValueAtTime(0.10*v,t0);g.gain.exponentialRampToValueAtTime(0.001,t0+0.05);
src.connect(f);f.connect(g);g.connect(a.destination);src.start();}
function bell(){const a=ac();if(!a)return;const t0=a.currentTime;
[523.25,784.99].forEach((fr,i)=>{const o=a.createOscillator(),g=a.createGain();
o.type='sine';o.frequency.value=fr;
g.gain.setValueAtTime(0.0001,t0+i*0.18);g.gain.exponentialRampToValueAtTime(0.06,t0+i*0.18+0.02);
g.gain.exponentialRampToValueAtTime(0.0001,t0+i*0.18+1.4);
o.connect(g);g.connect(a.destination);o.start(t0+i*0.18);o.stop(t0+i*0.18+1.5);});}

// ---------- input ----------
function pointerPos(e){return{x:e.clientX,y:e.clientY};}
addEventListener('pointerdown',e=>{
const p=pointerPos(e);st.mouse.x=p.x;st.mouse.y=p.y;st.mouse.down=true;st.mouse.energy=0;
if(st.phase==='idle'){startRattle();}
else if(st.phase==='stick'){pullStick();}
else if(st.phase==='slip'&&st.slipOpen>0.9){
  if(!st.draw.g.good&&!st.draw.tied){startTie();}
  else{st.keepFlash=st.t;setPhase('keep');}}
else if(st.phase==='tied'||st.phase==='keep'){resetToIdle();}
});
addEventListener('pointermove',e=>{
const p=pointerPos(e);
if(st.mouse.down){st.mouse.energy+=Math.abs(p.x-st.mouse.px)+Math.abs(p.y-st.mouse.py);
st.shakeX=(p.x-st.mouse.px)*0.004;}
st.mouse.px=p.x;st.mouse.py=p.y;st.mouse.x=p.x;st.mouse.y=p.y;});
addEventListener('pointerup',()=>{st.mouse.down=false;st.shakeX=0;});
addEventListener('keydown',e=>{
if(e.key==='s'||e.key==='S'){if(st.draw)saveCard();}});

function startRattle(){
setPhase('rattle');clack(1);
setTimeout(()=>clack(0.8),120);setTimeout(()=>clack(0.9),260);setTimeout(()=>clack(0.7),420);
setTimeout(()=>clack(1),600);setTimeout(()=>clack(0.8),780);}
function finishRattle(){
// choose draw
if(!st.daily){st.draw=drawFor(P.uid+'-'+TODAY);commitDaily(st.draw);st.practice=false;}
else{P.practice++;save();st.draw=drawFor(P.uid+'-practice-'+P.practice+'-'+TODAY);st.practice=true;}
st.stickUp=0;setPhase('stick');clack(1);}
function pullStick(){setPhase('slip');bell();}
function startTie(){
setPhase('tiefly');
st.fly={t0:st.t,knotX:0.30+0.4*((P.tiedList.length*0.13)%1.0)};
clack(0.6);}
function finishTie(){
st.draw.tied=true;
if(!st.practice&&P.last===TODAY){P.tied=true;st.daily.tied=true;}
P.tiedList.push({g:st.draw.g.k,d:TODAY});
if(P.tiedList.length>14)P.tiedList.splice(0,P.tiedList.length-14);
save();setPhase('tied');}
function resetToIdle(){st.draw=null;st.slipOpen=0;st.stickUp=0;st.fly=null;setPhase('idle');}

// ---------- drawing helpers ----------
function rr(x,y,w,h,r){cx.beginPath();cx.moveTo(x+r,y);cx.arcTo(x+w,y,x+w,y+h,r);
cx.arcTo(x+w,y+h,x,y+h,r);cx.arcTo(x,y+h,x,y,r);cx.arcTo(x,y,x+w,y,r);cx.closePath();}
function easeOut(k){return 1-Math.pow(1-k,3);}
function easeInOut(k){return k<0.5?2*k*k:1-Math.pow(-2*k+2,2)/2;}

// ---------- geometry ----------
function geom(){
const g={};
g.ropeY=H*0.16;
g.boxCX=W/2; g.boxTop=H*0.40;
g.boxW=Math.min(260*S+40,W*0.55); g.boxH=g.boxW*1.06;
g.boxBot=g.boxTop+g.boxH;
return g;}

// ---------- rope with tied slips ----------
function drawRope(t,g){
// rope: gentle catenary
cx.strokeStyle='rgba(138,122,94,0.85)';cx.lineWidth=2.5;
cx.beginPath();
const x0=W*0.06,x1=W*0.94,sag=14*S+Math.sin(t*0.7)*2;
cx.moveTo(x0,g.ropeY);
cx.quadraticCurveTo(W/2,g.ropeY+sag*2,x1,g.ropeY);
cx.stroke();
// post hints
cx.fillStyle='rgba(138,122,94,0.5)';
cx.fillRect(x0-3,g.ropeY-26,6,30);cx.fillRect(x1-3,g.ropeY-26,6,30);
// tied slips (persisted) hanging along rope
const list=P.tiedList;
for(let i=0;i<list.length;i++){
const f=(i+1)/(list.length+1);
const rx=x0+(x1-x0)*f;
const ry=g.ropeY+sag*2*(1-Math.pow(2*f-1,2));
drawTiedSlip(rx,ry,t,i,list[i]);}
// the slip currently flying/hanging from today's tie
if(st.phase==='tied'&&st.fly){
drawTiedSlip(st.fly.knotX*W,g.ropeY+sag*2*(1-Math.pow(2*st.fly.knotX-1,2)),t,99,{g:st.draw.g.k});}}

function drawTiedSlip(x,y,t,seed,rec){
const sway=Math.sin(t*1.1+seed*1.7)*0.06+Math.sin(t*2.3+seed)*0.02;
cx.save();cx.translate(x,y);cx.rotate(sway);
// folded strip
cx.fillStyle=CREAM;
rr(-5*S-2,0,10*S+4,46*S+10,3);cx.fill();
cx.fillStyle='rgba(22,19,14,0.18)';
rr(-5*S-2,0,10*S+4,9,3);cx.fill(); // fold band
// tiny knot
cx.strokeStyle='rgba(138,122,94,0.9)';cx.lineWidth=1.5;
cx.beginPath();cx.arc(0,-2,3,0,7);cx.stroke();
cx.restore();}

// ---------- the box ----------
function drawBox(t,g){
const cxp=g.boxCX,top=g.boxTop,w=g.boxW,h=g.boxH;
// rattle transform
let rot=0,jx=0;
if(st.phase==='rattle'){const k=Math.min(1,st.phaseT*0+ (st.t-st.phaseT)*3);
const decay=1-Math.max(0,(st.t-st.phaseT-0.9)/0.3);
rot=Math.sin(st.t*46)*0.035*decay;jx=Math.sin(st.t*61)*3*decay;}
else if(st.mouse.down&&st.phase==='idle'){rot=Math.sin(st.t*30)*0.01;}
cx.save();cx.translate(cxp+jx,(top+h/2));cx.rotate(rot);cx.translate(-cxp,-(top+h/2));

// shadow
cx.fillStyle='rgba(0,0,0,0.5)';
cx.beginPath();cx.ellipse(cxp,g.boxBot+10*S,w*0.56,10*S+3,0,0,7);cx.fill();

// body: hexagonal prism, dark lacquer, gold bands
const hw=w/2,bev=w*0.16;
// side faces
cx.fillStyle='#0f0d09';
cx.beginPath();
cx.moveTo(cxp-hw,top+bev*0.6);cx.lineTo(cxp-hw+bev*0.5,top);cx.lineTo(cxp-hw+bev*0.5,top+h);cx.lineTo(cxp-hw,top+h-bev*0.6);cx.closePath();cx.fill();
cx.beginPath();
cx.moveTo(cxp+hw,top+bev*0.6);cx.lineTo(cxp+hw-bev*0.5,top);cx.lineTo(cxp+hw-bev*0.5,top+h);cx.lineTo(cxp+hw,top+h-bev*0.6);cx.closePath();cx.fill();
// front face
const grd=cx.createLinearGradient(cxp-hw,0,cxp+hw,0);
grd.addColorStop(0,'#171310');grd.addColorStop(0.5,'#241d16');grd.addColorStop(1,'#171310');
cx.fillStyle=grd;
rr(cxp-hw+bev*0.5,top,w-bev,h,6);cx.fill();
// gold bands
cx.fillStyle=GOLD;
rr(cxp-hw+bev*0.5,top+4,w-bev,3.5,2);cx.fill();
rr(cxp-hw+bev*0.5,top+h-8,w-bev,3.5,2);cx.fill();
// hole: ellipse at top with stick tops
const hy=top+bev*0.62;
cx.fillStyle='#070605';
cx.beginPath();cx.ellipse(cxp,hy,w*0.30,w*0.075,0,0,7);cx.fill();
// stick tops fanned in the hole
for(let i=-3;i<=3;i++){
const sx=cxp+i*w*0.075,jig=st.phase==='rattle'?Math.sin(st.t*40+i*2)*2.5:0;
cx.fillStyle='#caa96a';
rr(sx-3.2,hy-14-jig,6.4,16,3);cx.fill();
cx.fillStyle='#a8863f';rr(sx-3.2,hy-14-jig,6.4,4,2);cx.fill();}
cx.strokeStyle='rgba(201,162,39,0.6)';cx.lineWidth=1.5;
cx.beginPath();cx.ellipse(cxp,hy,w*0.30,w*0.075,0,0,7);cx.stroke();

// cream panel with the canonical mark (ink render on the light panel) + vertical おみくじ
const pw=w*0.52,ph=h*0.66,px0=cxp-pw/2,py0=top+h*0.17;
cx.fillStyle=CREAM;rr(px0,py0,pw,ph,5);cx.fill();
cx.strokeStyle='rgba(22,19,14,0.25)';cx.lineWidth=1;rr(px0+3,py0+3,pw-6,ph-6,3);cx.stroke();
const mw=pw*0.56;
const chw=(ph*0.90-mw-14)/4,fs=Math.max(10,chw*0.92);
const tot=mw+8+chw*4;let cy=py0+(ph-tot)/2;
if(IMG_INK.complete&&IMG_INK.naturalWidth)cx.drawImage(IMG_INK,cxp-mw/2,cy,mw,mw);
cy+=mw+8;
cx.fillStyle=INK;cx.font='700 '+Math.round(fs)+'px '+JP;cx.textAlign='center';
const vtxt='おみくじ';
for(let i=0;i<vtxt.length;i++)cx.fillText(vtxt[i],cxp,cy+chw*(i+1)-chw*0.12);
cx.restore();}

// ---------- the rising stick ----------
function drawStick(t,g){
if(st.phase!=='stick')return;
if(st.phase==='stick')st.stickUp=easeOut(Math.min(1,(t-st.phaseT)/0.7));
const up=st.stickUp;
const hy=g.boxTop+g.boxW*0.16*0.62;
const len=150*S+30;
const sx=g.boxCX,sy=hy-up*len;
cx.save();
cx.fillStyle='#caa96a';
rr(sx-4.5,sy,9,len,4);cx.fill();
cx.fillStyle='#a8863f';rr(sx-4.5,sy,9,10,4);cx.fill();
// kanji number on the stick's top
if(up>0.5){cx.save();cx.translate(sx,sy+34);cx.fillStyle=INK;
cx.font='700 16px '+JP;cx.textAlign='center';
cx.fillText(kanNum(st.draw?st.draw.num:1),0,0);cx.restore();}
cx.restore();}

// ---------- the slip ----------
function drawSlip(t,g){
if(st.phase!=='slip'&&st.phase!=='tiefly'&&st.phase!=='keep'&&st.phase!=='tied')return;
if(st.phase==='slip')st.slipOpen=easeOut(Math.min(1,(t-st.phaseT)/0.8));
else if(st.phase==='tiefly')st.slipOpen=Math.max(0.12,1-(t-st.phaseT)/0.5);
else st.slipOpen=1;
const o=st.slipOpen;
if(st.phase==='tied')return;
const d=st.draw;if(!d)return;

// tie fly: after fold, arc to rope
let flyX=0,flyY=0,flyR=0;
if(st.phase==='tiefly'&&st.fly){
const k=Math.min(1,(t-st.phaseT-0.35)/0.7);
if(k>0){const kk=easeInOut(k);
const x0=W/2,y0=H*0.52,x1=st.fly.knotX*W,y1=g.ropeY+8;
flyX=(x1-x0)*kk;flyY=(y1-y0)*kk-Math.sin(kk*Math.PI)*80*S;
flyR=kk*2.2;}
if(k>=1){finishTie();return;}}

const cxp=W/2+flyX,cyp=H*0.52+flyY;
const sw=Math.min(340,W-60),sh=430*o;
cx.save();cx.translate(cxp,cyp);cx.rotate(flyR);
cx.shadowColor='rgba(0,0,0,0.55)';cx.shadowBlur=28;cx.shadowOffsetY=8;
rr(-sw/2,-sh/2,sw,sh,8);cx.fillStyle='#f8efdc';cx.fill();
cx.shadowColor='transparent';
cx.lineWidth=3;cx.strokeStyle=GOLD;rr(-sw/2+6,-sh/2+6,sw-12,sh-12,5);cx.stroke();
if(o>0.45){
const fade=Math.min(1,(o-0.45)/0.4);
cx.save();cx.globalAlpha=fade;
// mark
if(IMG_INK.complete&&IMG_INK.naturalWidth){cx.drawImage(IMG_INK,-34,-sh/2+18,68,68);}
cx.fillStyle=DIM;cx.font='700 10px "JetBrains Mono"';cx.textAlign='center';
cx.fillText(st.practice?'P R A C T I C E   D R A W':(st.draw.tied?'T O D A Y \u2019 S   D R A W':'T O D A Y \u2019 S   D R A W'),sw/2-88,-sh/2+46);
cx.fillStyle=DIM;cx.font='400 10px "JetBrains Mono"';
cx.fillText('no. '+d.num,sw/2-88,-sh/2+62);
// grade
cx.fillStyle=INK;cx.font='700 86px '+JP;
cx.fillText(d.g.kanji,0,-sh/2+196);
cx.fillStyle=d.g.good?GOLD:VERM;cx.font='700 15px "JetBrains Mono"';
cx.fillText(d.g.roma+' \u00b7 '+d.g.en,0,-sh/2+228);
// line
cx.fillStyle=INK;cx.font='700 14px "JetBrains Mono"';
wrapText(d.line,0,-sh/2+272,sw-56,19);
// lucky item
cx.fillStyle=DIM;cx.font='400 11px "JetBrains Mono"';
cx.fillText('lucky item: '+d.item,0,sh/2-44);
// hanko
cx.fillStyle=VERM;cx.beginPath();cx.arc(sw/2-40,sh/2-40,15,0,7);cx.fill();
cx.fillStyle='#f8efdc';cx.font='700 15px '+JP;cx.fillText('福',sw/2-40,sh/2-35);
cx.restore();}
cx.restore();}

function wrapText(txt,x,y,maxW,lh){
const words=txt.split(' ');let line='',yy=y;
for(const w of words){
if(cx.measureText(line+' '+w).width>maxW&&line){cx.fillText(line,x,yy);line=w;yy+=lh;}
else line=line?line+' '+w:w;}
cx.fillText(line,x,yy);}

// ---------- keep flash ----------
function drawKeep(t){
if(st.phase!=='keep')return;
const d=t-st.keepFlash;
if(d>1.4){resetToIdle();return;}
cx.save();cx.globalAlpha=1-d/1.4;
cx.fillStyle=GOLD_HI;cx.font='700 16px "JetBrains Mono"';cx.textAlign='center';
cx.fillText('+ carried with you',W/2,H*0.52-Math.min(430,H-60)/2-24-d*30);
cx.restore();}

// ---------- main frame ----------
let last=performance.now()/1000;
function frame(){
const now=performance.now()/1000;let dt=now-last;last=now;if(SHOT)dt=0;
st.t+=dt;const t=st.t;
if(st.phase==='rattle'&&t-st.phaseT>1.1)finishRattle();

const g=geom();
// bg
cx.fillStyle='#14110C';cx.fillRect(0,0,W,H);
const rg=cx.createRadialGradient(W/2,H*0.52,40,W/2,H*0.52,Math.max(W,H)*0.65);
rg.addColorStop(0,'rgba(201,162,39,0.10)');rg.addColorStop(1,'rgba(0,0,0,0)');
cx.fillStyle=rg;cx.fillRect(0,0,W,H);
for(const c of bok){const a=0.04+0.04*Math.sin(t*0.8+c.ph);
cx.fillStyle='rgba(201,162,39,'+a.toFixed(3)+')';
cx.beginPath();cx.arc(c.x*W,c.y*H,c.r*2.4,0,7);cx.fill();}

drawRope(t,g);
drawBox(t,g);
drawStick(t,g);
drawSlip(t,g);
drawKeep(t);

requestAnimationFrame(frame);}

function rrO(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);
c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}
function wrapO(c,txt,x,y,maxW,lh){const words=txt.split(' ');let line='',yy=y;
for(const w of words){if(c.measureText(line+' '+w).width>maxW&&line){c.fillText(line,x,yy);line=w;yy+=lh;}
else line=line?line+' '+w:w;}c.fillText(line,x,yy);}
function fmtDate(){const m=['january','february','march','april','may','june','july','august','september','october','november','december'];
const d=new Date();return m[d.getMonth()]+' '+d.getDate()+' '+d.getFullYear();}
function saveCard(){const off=renderCard();
off.toBlob(b=>{if(!b)return;const a=document.createElement('a');
a.href=URL.createObjectURL(b);a.download='lucky-cat-omikuji.png';a.click();
setTimeout(()=>URL.revokeObjectURL(a.href),4000);});}

// ---------- deterministic QA frames ----------
if(SHOT){
st.t=2.0;
// ensure a deterministic draw
P.uid='shot';
if(!st.daily){st.draw=drawFor('shot-'+TODAY);}else{st.draw=st.daily;}
if(Q.has('tie')){
// rope with tied slips, mid-idle
P.tiedList=[{g:'kyo',d:TODAY},{g:'daikyo',d:TODAY},{g:'kyo',d:TODAY},{g:'suekichi',d:TODAY},{g:'kyo',d:TODAY}];
st.phase='idle';
}else{
st.draw=st.draw||drawFor('shot-'+TODAY);
st.practice=false;st.phase='slip';st.slipOpen=1;st.stickUp=1;}
['hud'].forEach(()=>{});
function shotRender(){resize();const t=st.t;const g=geom();
cx.fillStyle='#14110C';cx.fillRect(0,0,W,H);
const rg=cx.createRadialGradient(W/2,H*0.52,40,W/2,H*0.52,Math.max(W,H)*0.65);
rg.addColorStop(0,'rgba(201,162,39,0.10)');rg.addColorStop(1,'rgba(0,0,0,0)');
cx.fillStyle=rg;cx.fillRect(0,0,W,H);
for(const c of bok){cx.fillStyle='rgba(201,162,39,0.07)';
cx.beginPath();cx.arc(c.x*W,c.y*H,c.r*2.4,0,7);cx.fill();}
drawRope(t,g);
if(Q.has('card')){
document.getElementById('top').style.display='none';
document.getElementById('streak').style.display='none';
document.getElementById('foot').style.display='none';
document.getElementById('hint').style.display='none';
cx.fillStyle='#0a0806';cx.fillRect(0,0,W,H);
const off=renderCard();const sc=Math.min(W/off.width,H/off.height);
cx.drawImage(off,(W-off.width*sc)/2,(H-off.height*sc)/2,off.width*sc,off.height*sc);return;}
drawBox(t,g);
if(Q.has('fly')&&st.phase!=='tied'){st.phase='tiefly';st.phaseT=st.t-0.55;st.slipOpen=0.12;st.fly=st.fly||{t0:st.phaseT,knotX:0.42};}
if(!Q.has('tie')){drawStick(t,g);drawSlip(t,g);}}
addEventListener('resize',shotRender);
requestAnimationFrame(()=>requestAnimationFrame(shotRender));
document.title='LUCKY CAT OMIKUJI - [shot]';
}else{frame();setPhase(st.phase);}
</script>
