<style>

.stick{position:absolute;z-index:1;width:18px;height:235px;left:85px;top:-170px;border-radius:7px 7px 2px 2px;background:linear-gradient(90deg,#ab6d31,#f5d38c 34%,#c89047 70%,#84501e);border:1px solid #5f3413;box-shadow:0 8px 12px #1f0202;transform:translateY(160px);transition:transform .3s}.stick:before{content:"御籤";position:absolute;top:18px;left:1px;writing-mode:vertical-rl;font:700 11px 'Noto Serif JP';letter-spacing:.12em;color:#68120d}.box.draw .stick{animation:rise 1.2s cubic-bezier(.17,.88,.32,1.2) forwards}@keyframes rise{0%{transform:translateY(160px)}68%,100%{transform:translateY(-18px)}}
.drawbtn{position:absolute;z-index:5;bottom:30px;left:50%;transform:translateX(-50%);width:calc(100% - 84px);height:52px;border:1px solid #f3ce71;background:#e4b94f;color:#3c0806;font:800 11px 'DM Sans';letter-spacing:.2em;cursor:pointer;box-shadow:0 5px 0 #8b571b;transition:.15s}.drawbtn:hover{background:#f6d47b;transform:translateX(-50%) translateY(-2px)}.drawbtn:active{transform:translateX(-50%) translateY(3px);box-shadow:0 2px 0 #8b571b}.drawbtn:disabled{cursor:default;filter:saturate(.5)}
.fortune{position:absolute;z-index:7;inset:28px;display:grid;grid-template-rows:auto 1fr auto;background:#f9e8bd;color:#2a0a06;border:1px solid #f8d577;box-shadow:0 26px 70px rgba(0,0,0,.74);opacity:0;pointer-events:none;transform:translateY(35px) rotateX(-7deg) scale(.96);transition:opacity .5s,transform .6s cubic-bezier(.2,.8,.2,1)}.fortune.show{opacity:1;pointer-events:auto;transform:none}.fortune:before{content:"";position:absolute;inset:10px;border:1px solid #9e2318;pointer-events:none}.fortune-top{padding:28px 31px 14px;display:flex;justify-content:space-between;align-items:flex-start}.seal{width:41px;height:41px;border:2px solid #ad281d;display:grid;place-items:center;color:#ad281d;font:900 21px 'Noto Serif JP';transform:rotate(-3deg)}.edition{text-align:right;font-size:8px;letter-spacing:.17em;color:#8c5e3a}.fortune-main{display:flex;flex-direction:column;align-items:center;text-align:center;padding:0 34px}.rankjp{font:900 clamp(52px,10vw,84px)/1 'Noto Serif JP';color:#941c14;letter-spacing:.04em}.ranken{font-size:10px;letter-spacing:.28em;color:#9a6b42;margin-top:7px}.poem{font:700 clamp(16px,3.8vw,23px)/1.55 'Noto Serif JP';max-width:340px;margin:28px 0 11px}.reading{font:500 12px/1.7 'DM Sans';color:#6c4630;max-width:350px}.omens{width:100%;display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:auto;padding-top:18px}.omen{border-top:1px solid #ba8760;padding:9px 4px}.omen b{display:block;font:700 10px 'Noto Serif JP';color:#941c14}.omen span{font-size:8px;letter-spacing:.08em;color:#72513b}.fortune-actions{position:relative;z-index:2;display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:17px 29px 28px}.action{height:40px;border:1px solid #9b2a20;background:transparent;color:#7f1c15;font:700 9px 'DM Sans';letter-spacing:.17em;cursor:pointer}.action.primary{background:#931d15;color:#ffeac2}.action:hover{filter:brightness(1.15)}
.mote{position:absolute;z-index:6;width:6px;height:11px;background:#e8bd55;pointer-events:none;animation:fall 1.3s ease-out forwards}@keyframes fall{to{transform:translate(var(--x),var(--y)) rotate(420deg);opacity:0}}
.toast{position:fixed;z-index:20;left:50%;bottom:20px;transform:translate(-50%,20px);padding:10px 15px;background:#f5d37a;color:#40100c;font-size:10px;letter-spacing:.1em;opacity:0;transition:.25s}.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:820px){.shell{display:block;padding:14px}.side{display:none}.stage{height:calc(100svh - 28px);min-height:570px}.header{top:31px;left:31px;right:31px}.scene{inset:105px 18px 76px}.box{transform:scale(.9)}.box.shake{animation:shakeMobile .72s cubic-bezier(.36,.07,.19,.97)}@keyframes shakeMobile{10%,90%{transform:scale(.9) translateX(-3px) rotate(-2deg)}20%,80%{transform:scale(.9) translateX(6px) rotate(3deg)}30%,50%,70%{transform:scale(.9) translateX(-9px) rotate(-4deg)}40%,60%{transform:scale(.9) translateX(9px) rotate(5deg)}}.drawbtn{bottom:24px;width:calc(100% - 58px)}.fortune{inset:16px}.fortune-main{padding:0 24px}.fortune-top{padding:26px 25px 10px}.poem{margin-top:18px}.omens{padding-top:12px}.fortune-actions{padding:14px 21px 22px}.rankjp{font-size:58px}}
@media(max-width:390px){.stage{min-height:540px}.title{font-size:25px}.header{top:28px}.scene{inset:94px 13px 68px}.box{transform:scale(.78)}.fortune{inset:10px}.fortune-top{padding:21px 20px 7px}.rankjp{font-size:49px}.poem{font-size:14px;margin:12px 0 6px}.reading{font-size:10px;line-height:1.55}.omen{padding-top:6px}.fortune-actions{padding:10px 16px 17px}.action{height:36px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>
</head><body>
<div class="grain"></div>
<main class="shell">
<aside class="side"><div><div class="eyebrow">LUCKY CAT · LAUNCH EDITION</div><div class="brand">招福<br>御籤<small>A SMALL RITUAL<br>FOR BRAVE DAYS</small></div><div class="rule"></div><div class="sigil">運</div></div><div class="instructions">SHAKE THE LACQUER BOX.<br>RECEIVE ONE SIGN.<br>KEEP WHAT RINGS TRUE.</div></aside>
<section class="stage" id="stage" aria-label="Lucky Cat fortune draw">
 <header class="header"><div><div class="kicker">FORTUNE NO. <span id="serial">—</span></div><h1 class="title">今日の御籤</h1></div><div class="count">ONE DRAW<br>ONE TURN</div></header>
 <div class="scene"><div class="halo"></div><div class="box" id="box"><div class="stick"></div><div class="lid"><div class="slot"></div></div><div class="bodybox"></div></div></div>
 <button class="drawbtn" id="draw">SHAKE & DRAW</button>
 <article class="fortune" id="fortune" aria-live="polite">
  <div class="fortune-top"><div class="seal">猫</div><div class="edition">LUCKY CAT<br>LAUNCH OMikuji · 2026</div></div>
  <div class="fortune-main"><div class="rankjp" id="rankjp">大吉</div><div class="ranken" id="ranken">GREAT BLESSING</div><div class="poem" id="poem"></div><div class="reading" id="reading"></div><div class="omens"><div class="omen"><b>勝負</b><span id="game"></span></div><div class="omen"><b>出会</b><span id="meeting"></span></div><div class="omen"><b>進路</b><span id="path"></span></div></div></div>
  <div class="fortune-actions"><button class="action" id="again">RETURN</button><button class="action primary" id="share">KEEP FORTUNE</button></div>
 </article>
</section>
<aside class="side right"><div class="vert">猫が招く　心が進む</div><div><div class="sigil">福</div><div class="rule"></div><div class="eyebrow">FORTUNE FAVORS<br>THE HAND IN MOTION</div></div></aside>
</main><div class="toast" id="toast">FORTUNE COPIED</div>
<script type="module">
const fortunes=[
 {jp:'大吉',en:'GREAT BLESSING',poem:'千の鈴より、ひとつの決意。',read:'A thousand bells may call, but one clear choice opens the gate. Move first. Luck is already leaning your way.',game:'PRESS ON',meeting:'OPEN DOOR',path:'BRIGHT'},
 {jp:'吉',en:'BLESSING',poem:'金のひげ、風の向きを知る。',read:'The golden whisker feels a change before the room does. Trust the small signal you nearly ignored.',game:'STEADY',meeting:'LISTEN',path:'EAST'},
 {jp:'中吉',en:'MIDDLE BLESSING',poem:'半月も、夜を照らすには足りる。',read:'You do not need the whole map. The next honest step will light enough of the road.',game:'PATIENT',meeting:'SOON',path:'RISING'},
 {jp:'小吉',en:'SMALL BLESSING',poem:'小判ひとつ、願いひとつ。',read:'A modest win arrives with perfect timing. Spend it on momentum, not applause.',game:'QUICK HAND',meeting:'FAMILIAR',path:'NARROW'},
 {jp:'末吉',en:'FUTURE BLESSING',poem:'まだ鳴らぬ鈴にも、音は眠る。',read:'The bell is quiet, not empty. Prepare with care. What looks late is gathering its voice.',game:'HOLD',meeting:'LATER',path:'FORMING'},
 {jp:'吉',en:'BLESSING',poem:'赤い門、迷いを置いてくぐれ。',read:'Leave one doubt outside the red gate. What follows asks for your full weight, not your perfect certainty.',game:'COMMIT',meeting:'BOLD',path:'FORWARD'},
 {jp:'大吉',en:'GREAT BLESSING',poem:'招く手の先に、朝がある。',read:'The beckoning paw is not asking you to wait. Call the future closer by making something real today.',game:'FAVORED',meeting:'WARM',path:'GOLDEN'},
 {jp:'中吉',en:'MIDDLE BLESSING',poem:'雨のあと、漆は深く光る。',read:'A recent difficulty has darkened your shine in the best way. The finish is richer for the weather.',game:'RECOVER',meeting:'TRUE',path:'CLEAR'},
 {jp:'小吉',en:'SMALL BLESSING',poem:'一歩の猫に、道は長くない。',read:'To a cat already walking, no road feels endless. Make the tiny move that makes the next one obvious.',game:'BEGIN',meeting:'NEAR',path:'SIMPLE'},
 {jp:'吉',en:'BLESSING',poem:'影を追わず、鈴の音を追え。',read:'Stop chasing the shape of what others have. Follow the sound only you can make.',game:'YOUR RULES',meeting:'HONEST',path:'UNMARKED'},
 {jp:'末吉',en:'FUTURE BLESSING',poem:'閉じた扇に、春は待つ。',read:'Not every pause is refusal. Keep your craft close. The right room will ask you to unfold it.',game:'RESERVE',meeting:'DELAYED',path:'HIDDEN'},
 {jp:'大吉',en:'GREAT BLESSING',poem:'九つの命、今日にひとつ使え。',read:'You have more chances than fear admits. Spend one life generously on the attempt that matters.',game:'ALL IN',meeting:'ELECTRIC',path:'OPEN'}
];
const $=s=>document.querySelector(s),box=$('#box'),fortune=$('#fortune'),draw=$('#draw');let active=null;
function tone(freq,d=.1,type='sine',vol=.05){try{const A=window.AudioContext||window.webkitAudioContext,a=tone.a||(tone.a=new A),o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.value=freq;g.gain.setValueAtTime(vol,a.currentTime);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+d);o.connect(g).connect(a.destination);o.start();o.stop(a.currentTime+d)}catch{}}
function motes(){const stage=$('#stage');for(let i=0;i<28;i++){const m=document.createElement('i');m.className='mote';m.style.left=(45+Math.random()*10)+'%';m.style.top=(38+Math.random()*12)+'%';m.style.setProperty('--x',(Math.random()*360-180)+'px');m.style.setProperty('--y',(100+Math.random()*300)+'px');m.style.animationDelay=(Math.random()*.25)+'s';stage.append(m);setTimeout(()=>m.remove(),1800)}}
function pick(){const day=Math.floor(Date.now()/86400000),last=+(localStorage.getItem('omikujiTurn')||0),seed=(day*17+last*7+performance.now()*1000)|0;return fortunes[Math.abs(seed)%fortunes.length]}
function render(f){active=f;$('#rankjp').textContent=f.jp;$('#ranken').textContent=f.en;$('#reading').textContent=f.read;['poem','game','meeting','path'].forEach(k=>$('#'+k).textContent=f[k]);$('#serial').textContent=String(Math.floor(Math.random()*900)+100)}
function doDraw(){if(draw.disabled)return;draw.disabled=true;box.classList.remove('draw');void box.offsetWidth;box.classList.add('shake');tone(180,.12,'triangle',.035);setTimeout(()=>tone(230,.12,'triangle',.035),180);setTimeout(()=>tone(280,.16,'triangle',.04),360);setTimeout(()=>{box.classList.add('draw');tone(660,.45,'sine',.06)},650);setTimeout(()=>{render(pick());fortune.classList.add('show');motes();tone(880,.7,'sine',.045);localStorage.setItem('omikujiTurn',String((+localStorage.getItem('omikujiTurn')||0)+1))},1500)}
draw.addEventListener('click',doDraw);$('#again').addEventListener('click',()=>{fortune.classList.remove('show');box.classList.remove('shake','draw');draw.disabled=false;setTimeout(()=>draw.focus(),500)});
function wrap(ctx,text,x,y,max,line){const words=text.split(' ');let row='';for(const word of words){const test=row?row+' '+word:word;if(ctx.measureText(test).width>max&&row){ctx.fillText(row,x,y);row=word;y+=line}else row=test}ctx.fillText(row,x,y);return y}
async function keepsake(){await document.fonts?.ready;const c=document.createElement('canvas');c.width=1200;c.height=1500;const x=c.getContext('2d');x.fillStyle='#f9e8bd';x.fillRect(0,0,c.width,c.height);x.strokeStyle='#a52419';x.lineWidth=5;x.strokeRect(48,48,1104,1404);x.strokeStyle='#d5a947';x.lineWidth=2;x.strokeRect(68,68,1064,1364);x.fillStyle='#a52419';x.font="900 220px 'Noto Serif JP',serif";x.textAlign='center';x.fillText(active.jp,600,390);x.font="700 30px 'DM Sans',sans-serif";x.letterSpacing='8px';x.fillText(active.en,600,455);x.letterSpacing='0px';x.fillStyle='#29100b';x.font="700 52px 'Noto Serif JP',serif";x.fillText(active.poem,600,610);x.font="500 30px 'DM Sans',sans-serif";wrap(x,active.read,600,730,850,48);x.strokeStyle='#bd8a56';x.beginPath();x.moveTo(150,1120);x.lineTo(1050,1120);x.stroke();x.fillStyle='#991f16';x.font="700 29px 'Noto Serif JP',serif";x.fillText(`勝負  ${active.game}　　出会  ${active.meeting}　　進路  ${active.path}`,600,1195);x.fillStyle='#7d5437';x.font="700 22px 'DM Sans',sans-serif";x.fillText('LUCKY CAT · LAUNCH OMIKUJI · 2026',600,1355);return new Promise(r=>c.toBlob(r,'image/png'))}
$('#share').addEventListener('click',async()=>{if(!active)return;const text=`Lucky Cat Omikuji — ${active.en}\n“${active.poem}”\n${active.read}`;try{const blob=await keepsake(),file=new File([blob],'lucky-cat-fortune.png',{type:'image/png'});if(navigator.canShare?.({files:[file]})){await navigator.share({title:'My Lucky Cat Fortune',text,files:[file]})}else{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=file.name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);showToast('FORTUNE SAVED')}}catch(e){if(e.name!=='AbortError'){await navigator.clipboard?.writeText(text);showToast('FORTUNE COPIED')}}});
function showToast(t='FORTUNE COPIED'){const x=$('#toast');x.textContent=t;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),1800)}
</script></body></html>
